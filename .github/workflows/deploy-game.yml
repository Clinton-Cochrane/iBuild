name: Deploy iBuild Game to AWS

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::370734989931:role/github-actions-ibuild-game-deploy
          aws-region: us-west-1

      - name: Deploy to S3
        run: aws s3 sync dist/ s3://clintoncochrane-ibuild-game-prod --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation \
          --distribution-id EHQYKVQGHPQ9O \
          --paths "/*"
