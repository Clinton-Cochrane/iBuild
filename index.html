<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite App</title>
  </head>
  <body>
    <style>
      @font-face {
        font-family: monogram;
        src: url(monogram.ttf);
      }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
      }

      body {
        font-family: monogram, monospace;
        font-size: 2rem;
        overflow: hidden;
      }

      #app {
        width: 100%;
        height: 100%;
        position: relative;
      }

      #game {
        display: block;
      }

      #direction-controls {
        position: absolute;
        right: max(1rem, env(safe-area-inset-right));
        bottom: max(1rem, env(safe-area-inset-bottom));
        z-index: 1;
        display: grid;
        grid-template-columns: repeat(3, clamp(44px, 9vw, 56px));
        grid-template-rows: repeat(2, clamp(44px, 9vw, 56px));
        gap: 6px;
      }

      .direction-btn {
        border: 2px solid rgba(255, 255, 255, 0.8);
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        font: 1.5rem sans-serif;
        cursor: pointer;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }

      .direction-btn[data-direction="up"] { grid-column: 2; }
      .direction-btn[data-direction="left"] { grid-column: 1; grid-row: 2; }
      .direction-btn[data-direction="down"] { grid-column: 2; grid-row: 2; }
      .direction-btn[data-direction="right"] { grid-column: 3; grid-row: 2; }

      .direction-btn.is-held {
        background: rgba(255, 255, 255, 0.9);
        color: black;
      }

      .direction-btn:focus-visible {
        outline: 3px solid #ffdf70;
        outline-offset: 2px;
      }

      #textbox {
        position: absolute;
        z-index: 2;
        left: 10%;
        right: 10%;
        bottom: 2vh;
        min-height: 10vh;
        max-height: 75vh;
        overflow-y: auto;
        background: white;
        border-radius: 3px;
        outline-style: solid;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        flex-wrap: wrap;
        justify-content: flex-start;
        align-items: flex-start;
        word-spacing: 0.2rem;
        filter: drop-shadow(0 0 0.75rem rgb(112, 112, 112));
        /* overflow: auto; */
      }

      #textbox-container.has-image #textbox {
        left: 50%;
        right: auto;
        width: min(32rem, calc(100vw - 2rem));
        box-sizing: border-box;
        transform: translateX(-50%);
      }

      .ui-text {
        margin: 0;
        width: 100%;
        min-width: 0;
        user-select: none;
      }

      #dialogue img {
        display: block;
        margin: 0.5rem auto;
        max-width: 100%;
        max-height: 45vh;
        object-fit: contain;
      }

      .ui-close-btn {
        font-family: monogram, monospace;
        border-style: none;
        border-radius: 3px;
        padding: 1rem;
        font-size: inherit;
      }

      .btn-container {
        align-self: flex-end;
        margin-top: 1rem;
      }

      .note {
        position: absolute;
        left: 5%;
        top: 1vh;
        display: flex;
        flex-direction: column;
        color: rgb(238, 238, 238);
        background: rgba(0, 0, 0, 0.7);
        padding: 0.25rem 0.5rem;
        pointer-events: none;
      }
    </style>
    <div id="app">
      <div>
        <p class="note">Move with WASD, arrow keys, or the buttons</p>

        <div id="textbox-container" style="display: none">
          <div id="textbox">
            <p id="dialogue" class="ui-text"></p>
            <div class="btn-container">
              <button id="close" class="ui-close-btn">Close</button>
            </div>
          </div>
        </div>
      </div>
      <canvas id="game"></canvas>
      <div id="direction-controls" role="group" aria-label="Movement controls">
        <button type="button" class="direction-btn" data-direction="up" aria-label="Move up">↑</button>
        <button type="button" class="direction-btn" data-direction="left" aria-label="Move left">←</button>
        <button type="button" class="direction-btn" data-direction="down" aria-label="Move down">↓</button>
        <button type="button" class="direction-btn" data-direction="right" aria-label="Move right">→</button>
      </div>
    </div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
